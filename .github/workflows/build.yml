name: Build

# Builds Checkmate AI for every platform. Run it manually from the Actions tab, or push a
# tag like v1.0.0 to also publish the packages as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: Windows x64 }
          - { os: macos-latest, label: macOS Apple Silicon }
          # Oldest supported glibc (2.35) so the binary also runs on ChromeOS Linux (Debian 12).
          - { os: ubuntu-22.04, label: Linux / ChromeOS x64 }
          # PySide6's ARM wheels need glibc 2.39+, so ARM builds need Debian 13 / Ubuntu 24.04+.
          - { os: ubuntu-24.04-arm, label: Linux / ChromeOS ARM64 }
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1 libfontconfig1 libdbus-1-3

      - name: Build
        run: |
          uv sync
          uv run python scripts/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: CheckmateAI-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
