[project]
name = "pychess"
version = "0.1.0"
description = "Play chess against an LLM (local, OpenAI or Anthropic) in a PySide6 UI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.11.0",
    "chess>=1.11.2",
    "openai>=3.26.0",
    "pyside6>=6.11.2",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
]
